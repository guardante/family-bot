services:
  bot:
    build: .
    # Образ из GitHub Container Registry: на сервере делаем pull, локально — build.
    image: ghcr.io/guardante/family-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_PATH: /data/nadia.db
    volumes:
      - botdata:/data

volumes:
  botdata:
